  <rect x="48" y="40" width="1304" height="110" rx="24" fill="#0F172A"/>
  <text x="88" y="92" fill="white" class="kh" font-size="34" font-weight="700">ដំណើរការគម្រោង TEAM10</text>
  <text x="88" y="128" fill="#CBD5E1" class="kh" font-size="18">លំហូរការទិញទំនិញរបស់អតិថិជន ការផ្ទៀងផ្ទាត់ការទូទាត់ និងការគ្រប់គ្រងផ្នែក Admin</text>

  <rect x="56" y="188" width="1288" height="320" rx="28" fill="white"/>
  <text x="88" y="234" fill="#150734" class="kh" font-size="28" font-weight="700">ដំណើរអតិថិជន</text>
  <text x="88" y="264" fill="#64748B" class="kh" font-size="16">ផ្នែកហាងសាធារណៈផ្តោតលើការស្វែងរកទំនិញ កន្រ្តក KHQR និងការទទួលវិក្កយបត្រ។</text>

  <rect x="86" y="310" width="176" height="126" rx="22" fill="#28559A"/>
  <text x="112" y="356" fill="white" class="kh" font-size="21" font-weight="700">1. ស្វែងរក</text>
  <text x="112" y="388" fill="#E2E8F0" class="kh" font-size="14">ទំព័រមេ</text>
  <text x="112" y="410" fill="#E2E8F0" class="kh" font-size="14">ស្វែងរក និងតម្រៀប</text>
  <text x="112" y="432" fill="#E2E8F0" class="kh" font-size="14">slides និងស្លាក</text>

  <rect x="326" y="310" width="176" height="126" rx="22" fill="#3778C2"/>
  <text x="352" y="356" fill="white" class="kh" font-size="21" font-weight="700">2. ជ្រើសរើស</text>
  <text x="352" y="388" fill="#EAF2FB" class="kh" font-size="14">មើលលម្អិតផលិតផល</text>
  <text x="352" y="410" fill="#EAF2FB" class="kh" font-size="14">ជ្រើសទំហំ</text>
  <text x="352" y="432" fill="#EAF2FB" class="kh" font-size="14">និងពណ៌</text>

  <rect x="566" y="310" width="176" height="126" rx="22" fill="#1F3E77"/>
  <text x="592" y="356" fill="white" class="kh" font-size="21" font-weight="700">3. កន្រ្តក</text>
  <text x="592" y="388" fill="#E2E8F0" class="kh" font-size="14">រក្សាទុកក្នុង session</text>
  <text x="592" y="410" fill="#E2E8F0" class="kh" font-size="14">កែចំនួន</text>
  <text x="592" y="432" fill="#E2E8F0" class="kh" font-size="14">ហើយទៅ Checkout</text>

  <rect x="806" y="310" width="176" height="126" rx="22" fill="#BC7080"/>
  <text x="832" y="356" fill="white" class="kh" font-size="21" font-weight="700">4. បង់ប្រាក់</text>
  <text x="832" y="388" fill="#FFF1F4" class="kh" font-size="14">បង្កើត KHQR</text>
  <text x="832" y="410" fill="#FFF1F4" class="kh" font-size="14">QR និងពេលរាប់ថយ</text>
  <text x="832" y="432" fill="#FFF1F4" class="kh" font-size="14">ផ្ទៀងផ្ទាត់ Bakong</text>

  <rect x="1046" y="310" width="218" height="126" rx="22" fill="#22C55E"/>
