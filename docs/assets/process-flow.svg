  <rect x="56" y="548" width="1288" height="324" rx="28" fill="white"/>
  <text x="88" y="594" fill="#150734" font-family="Arial, sans-serif" font-size="28" font-weight="700">Admin workflow</text>
  <text x="88" y="624" fill="#64748B" font-family="Arial, sans-serif" font-size="16">The back office controls products, categories, slides, payments, users, and role-based staff access.</text>

  <rect x="86" y="668" width="208" height="132" rx="22" fill="#28559A"/>
  <text x="112" y="714" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">Admin login</text>
  <text x="112" y="746" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">Dedicated admin</text>
  <text x="112" y="768" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">authentication and</text>
  <text x="112" y="790" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">session handling</text>

  <rect x="356" y="668" width="208" height="132" rx="22" fill="#3778C2"/>
  <text x="382" y="714" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">Dashboard</text>
  <text x="382" y="746" fill="#EAF2FB" font-family="Arial, sans-serif" font-size="15">Revenue analytics,</text>
  <text x="382" y="768" fill="#EAF2FB" font-family="Arial, sans-serif" font-size="15">trend charts,</text>
  <text x="382" y="790" fill="#EAF2FB" font-family="Arial, sans-serif" font-size="15">best sellers, status mix</text>

  <rect x="626" y="668" width="208" height="132" rx="22" fill="#746088"/>
  <text x="652" y="714" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">Catalog ops</text>
  <text x="652" y="746" fill="#F5F3FF" font-family="Arial, sans-serif" font-size="15">Products, categories,</text>
  <text x="652" y="768" fill="#F5F3FF" font-family="Arial, sans-serif" font-size="15">sizes, colors, slides,</text>
  <text x="652" y="790" fill="#F5F3FF" font-family="Arial, sans-serif" font-size="15">media updates</text>

  <rect x="896" y="668" width="208" height="132" rx="22" fill="#3F5C83"/>
  <text x="922" y="714" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">Operations</text>
  <text x="922" y="746" fill="#EFF6FF" font-family="Arial, sans-serif" font-size="15">Orders, payment</text>
  <text x="922" y="768" fill="#EFF6FF" font-family="Arial, sans-serif" font-size="15">history, user lists,</text>
  <text x="922" y="790" fill="#EFF6FF" font-family="Arial, sans-serif" font-size="15">staff directory</text>

  <rect x="1166" y="668" width="150" height="132" rx="22" fill="#F97316"/>
  <text x="1192" y="714" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">Roles</text>
  <text x="1192" y="746" fill="#FFF7ED" font-family="Arial, sans-serif" font-size="15">Admin</text>
  <text x="1192" y="768" fill="#FFF7ED" font-family="Arial, sans-serif" font-size="15">Stock</text>
  <text x="1192" y="790" fill="#FFF7ED" font-family="Arial, sans-serif" font-size="15">Employee</text>

