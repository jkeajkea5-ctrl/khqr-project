  <text x="88" y="624" fill="#64748B" class="kh" font-size="16">ផ្នែកខាងក្រោយគ្រប់គ្រងផលិតផល ប្រភេទ ស្លាយ ការទូទាត់ អ្នកប្រើ និងតួនាទីបុគ្គលិក។</text>

