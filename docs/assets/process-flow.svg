<svg width="1400" height="920" viewBox="0 0 1400 920" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1400" height="920" rx="28" fill="#F3F6FB"/>
  <rect x="48" y="40" width="1304" height="110" rx="24" fill="#0F172A"/>
  <text x="88" y="92" fill="white" font-family="Arial, sans-serif" font-size="34" font-weight="700">TEAM10 Project Process Flow</text>
  <text x="88" y="128" fill="#CBD5E1" font-family="Arial, sans-serif" font-size="18">Customer shopping lifecycle, payment verification path, and admin management workflow</text>

  <rect x="56" y="188" width="1288" height="320" rx="28" fill="white"/>
  <text x="88" y="234" fill="#150734" font-family="Arial, sans-serif" font-size="28" font-weight="700">Customer journey</text>
  <text x="88" y="264" fill="#64748B" font-family="Arial, sans-serif" font-size="16">The public storefront centers on product discovery, cart building, KHQR payment, and invoice confirmation.</text>

  <rect x="86" y="310" width="176" height="126" rx="22" fill="#28559A"/>
  <text x="112" y="356" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">1. Browse</text>
  <text x="112" y="388" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">Home page,</text>
  <text x="112" y="410" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">search, filters,</text>
  <text x="112" y="432" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">carousel, badges</text>

  <rect x="326" y="310" width="176" height="126" rx="22" fill="#3778C2"/>
  <text x="352" y="356" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">2. Decide</text>
  <text x="352" y="388" fill="#EAF2FB" font-family="Arial, sans-serif" font-size="15">Product detail,</text>
  <text x="352" y="410" fill="#EAF2FB" font-family="Arial, sans-serif" font-size="15">size and color</text>
  <text x="352" y="432" fill="#EAF2FB" font-family="Arial, sans-serif" font-size="15">selection</text>

  <rect x="566" y="310" width="176" height="126" rx="22" fill="#1F3E77"/>
  <text x="592" y="356" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">3. Cart</text>
  <text x="592" y="388" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">Session cart,</text>
  <text x="592" y="410" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">quantity updates,</text>
  <text x="592" y="432" fill="#E2E8F0" font-family="Arial, sans-serif" font-size="15">selected checkout</text>

  <rect x="806" y="310" width="176" height="126" rx="22" fill="#BC7080"/>
  <text x="832" y="356" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">4. Pay</text>
  <text x="832" y="388" fill="#FFF1F4" font-family="Arial, sans-serif" font-size="15">KHQR generation,</text>
  <text x="832" y="410" fill="#FFF1F4" font-family="Arial, sans-serif" font-size="15">QR timer, Bakong</text>
  <text x="832" y="432" fill="#FFF1F4" font-family="Arial, sans-serif" font-size="15">verification</text>

  <rect x="1046" y="310" width="218" height="126" rx="22" fill="#22C55E"/>
  <text x="1072" y="356" fill="white" font-family="Arial, sans-serif" font-size="22" font-weight="700">5. Confirm</text>
  <text x="1072" y="388" fill="#F0FDF4" font-family="Arial, sans-serif" font-size="15">Order marked PAID,</text>
  <text x="1072" y="410" fill="#F0FDF4" font-family="Arial, sans-serif" font-size="15">invoice displayed,</text>
  <text x="1072" y="432" fill="#F0FDF4" font-family="Arial, sans-serif" font-size="15">Telegram notice sent</text>

  <path d="M262 372H326" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
